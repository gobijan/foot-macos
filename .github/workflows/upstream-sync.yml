# Merges upstream foot into 'macos' once a week, and opens (or updates)
# a pull request if the merge is clean, and the result builds and
# passes the tests. If not, an issue is opened instead; resolve it
# locally with macos/sync-upstream.sh.

name: Upstream sync

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: macos
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://codeberg.org/dnkl/foot.git
          git fetch --tags upstream master

          count=$(git rev-list --count HEAD..upstream/master)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          [ "$count" -eq 0 ] && exit 0

          version=$(git describe --tags --always upstream/master)
          echo "version=$version" >> "$GITHUB_OUTPUT"

          git switch -c upstream-sync
          if git merge --no-edit -m "Merge upstream foot $version" upstream/master; then
            echo "clean=yes" >> "$GITHUB_OUTPUT"
          else
            {
              echo 'conflicts<<EOF'
              git diff --name-only --diff-filter=U
              echo EOF
            } >> "$GITHUB_OUTPUT"
            git merge --abort
            echo "clean=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        id: build
        if: steps.merge.outputs.clean == 'yes'
        run: |
          brew install meson ninja bison
          meson setup build --native-file macos/native.ini --buildtype=release
          ninja -C build
          meson test -C build config --print-errorlogs

      - name: Open pull request
        if: steps.merge.outputs.clean == 'yes' && steps.build.outcome == 'success'
        run: |
          git push --force origin upstream-sync
          body=$(printf 'Merges %s upstream commit(s), up to %s.\n\nThe merge was clean, and the result builds and passes the tests (on macOS). Give it a quick manual test before merging.\n\n%s' \
            "${{ steps.merge.outputs.count }}" "${{ steps.merge.outputs.version }}" \
            "$(git log --oneline --no-decorate macos..upstream/master | sed 's/^/- /')")
          if gh pr view upstream-sync --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit upstream-sync --title "Sync with upstream foot ${{ steps.merge.outputs.version }}" --body "$body"
          else
            gh pr create --base macos --head upstream-sync \
              --title "Sync with upstream foot ${{ steps.merge.outputs.version }}" --body "$body"
          fi

      - name: Report problems
        if: steps.merge.outputs.count != '0' && (steps.merge.outputs.clean == 'no' || steps.build.outcome == 'failure')
        run: |
          title="Upstream sync needs attention (${{ steps.merge.outputs.version }})"
          body=$(printf 'Merging %s upstream commit(s), up to %s, needs manual work.\n\nConflicting files:\n%s\n\nBuild/tests: %s\n\nResolve locally with `macos/sync-upstream.sh` (see `macos/UPSTREAM.md`).' \
            "${{ steps.merge.outputs.count }}" "${{ steps.merge.outputs.version }}" \
            "$(echo '${{ steps.merge.outputs.conflicts }}' | sed 's/^/- /')" \
            "${{ steps.build.outcome }}")
          existing=$(gh issue list --state open --search "Upstream sync needs attention in:title" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
