name: Website

# macos/site, on GitHub Pages: https://screenisland.com/foot-macos/
# (gobijan.github.io's domain)

on:
  push:
    branches: [main]
    paths:
      - macos/site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Generates the site's files; not one of them
      - run: rm macos/site/make-assets.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: macos/site

      - id: deployment
        uses: actions/deploy-pages@v4
