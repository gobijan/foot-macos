# Meson cross file for building foot for Intel Macs on Apple silicon,
# for the universal foot.app (macos/dist.sh):
#
#   meson setup build-x86_64 --native-file macos/native.ini \
#       --cross-file macos/x86_64.ini

[binaries]
c = ['cc', '-arch', 'x86_64']
objc = ['cc', '-arch', 'x86_64']
ar = 'ar'
strip = 'strip'
# For libxkbcommon (cross builds don't read native.ini's)
bison = '/opt/homebrew/opt/bison/bin/bison'

[host_machine]
system = 'darwin'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
